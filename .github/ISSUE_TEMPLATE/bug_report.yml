name: Bug report
description: Report a reproducible PLIUM problem (no private clipboard data)
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never attach real clipboard history, passwords, tokens or private files. Use synthetic example data."
  - type: input
    id: version
    attributes:
      label: PLIUM version and Windows version
      placeholder: "0.4.0-plium.9 / Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: layout
    attributes:
      label: Layout
      options: ["Top: 1 row", "Top: 3 rows", "Left edge", "Right edge", "Tray / startup", "Other"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps (synthetic data only)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
